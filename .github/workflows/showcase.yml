name: Offline showcase

on: [push, pull_request]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -B tests/test_showcase.py

  copy-number-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true
      - name: Install report dependencies
        run: Rscript -e 'install.packages(c("BiocManager", "jsonlite")); BiocManager::install("GenomicRanges", ask = FALSE, update = FALSE)'
      - run: python -B tests/test_copy_number_report.py
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - run: python -B tests/check_report_browser.py
      - name: Package synthetic demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp examples/showcase/synthetic.copy-number.html _site/index.html
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [demo, copy-number-report]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy synthetic demo
        id: deployment
        uses: actions/deploy-pages@v4
